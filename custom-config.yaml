base:
  dns:
    enable: true
    listen: 0.0.0.0:53
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    fake-ip-filter:
      - "*.lan"
      - "*.local"
      - +.msftconnecttest.com
      - +.msftncsi.com
      - localhost.ptlogin2.qq.com
    default-nameserver:
      - 223.5.5.5
      - 119.29.29.29
    # DNS 查询按分流规则走：国外 DoH 的查询自动走代理隧道出去（不泄露、可达）
    respect-rules: true
    # 用于解析代理服务器域名 / 走直连的 DNS 查询
    proxy-server-nameserver:
      - 223.5.5.5
      - 119.29.29.29
    nameserver-policy:
      geosite:private:
        - 223.5.5.5
      geosite:cn:
        - https://dns.alicdn.com/dns-query
        - https://doh.pub/dns-query
      # ===== 指定 DIRECT 的域名 → 国内 DNS 直连解析 =====
      "+.waxueshe.com":
        - 223.5.5.5
        - 119.29.29.29
      "+.cdn-apple.com":
        - 223.5.5.5
        - 119.29.29.29
      "+.deepseek.com":
        - 223.5.5.5
        - 119.29.29.29
      "+.qianwenai.com":
        - 223.5.5.5
        - 119.29.29.29
      "+.volces.com":
        - 223.5.5.5
        - 119.29.29.29
    # 默认 nameserver：国外 DoH（respect-rules 生效后其查询走代理）
    nameserver:
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
  sniffer:
    enable: true
    override-destination: true
    force-dns-mapping: true
    parse-pure-ip: true
    sniff:
      TLS:
        ports:
          - 443
          - 8443
      HTTP:
        ports:
          - 80
          - 8080-8880
        override-destination: true
proxies:
