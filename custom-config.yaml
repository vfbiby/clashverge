# 自定义基础底座配置 (DNS & 嗅探)
base:
  dns:
    enable: true
    listen: 0.0.0.0:53
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    fake-ip-filter:
      - '*.lan'
      - '*.local'
      - '+.msftconnecttest.com'
      - '+.msftncsi.com'
      - 'localhost.ptlogin2.qq.com'
    default-nameserver:
      - 223.5.5.5
      - 119.29.29.29
      - 1.1.1.1
    nameserver-policy:
      "geosite:cn": [https://dns.alicdn.com/dns-query, https://doh.pub/dns-query]
      "geosite:private": [223.5.5.5]
    nameserver:
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
      - https://dns.cloudflare.com/dns-query
    proxy-server-nameserver:
      - 223.5.5.5
      - 119.29.29.29

  sniffer:
    enable: true
    override-destination: true
    force-dns-mapping: true
    parse-pure-ip: true
    sniff:
      TLS:
        ports: [443, 8443]
      HTTP:
        ports: [80, 8080-8880]
        override-destination: true

# 自建节点列表
proxies:
  - name: "🇺🇸 USA_Los_LAX-DC2 xtls-reality"
    type: vless
    server: "154.53.75.226"
    port: 8881
    uuid: "decf85cf-9aca-4328-a071-3837631098eb"
    encryption: ""
    tls: true
    servername: "addons.mozilla.org"
    flow: "xtls-rprx-vision"
    client-fingerprint: "chrome"
    reality-opts:
      public-key: "XLY4_lSmUIrs53Ae2LYqpjEWKM7HuAvtOE5t2JNM83c"
    network: "tcp"

# 自定义策略组
groups:
  - name: "Claude"
    type: "select"
    proxies:
      - "🇺🇸 USA_Los_LAX-DC2 xtls-reality"

  - name: "MyGoogle"
    type: "select"
    proxies:
      - "🇺🇸 USA_Los_LAX-DC2 xtls-reality"
      - "Proxies"

  - name: "Custom"
    type: "select"
    proxies:
      - "🇺🇸 USA_Los_LAX-DC2 xtls-reality"
      - "Proxies"

  - name: "CustomDirect"
    type: "select"
    proxies:
