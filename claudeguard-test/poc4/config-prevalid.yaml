# PoC-4 (P1a) 预验用配置 —— 普通用户权限 (dns.listen 1053, 无 tun 入站)
# 除上述两处外与 config-tun.yaml 逐字一致; 预验即验"真配置"的解析/规则/白名单行为
mixed-port: 7892
allow-lan: false
bind-address: '127.0.0.1'
mode: rule
log-level: info
external-controller: 127.0.0.1:9095
secret: ''

profile:
  store-selected: false
  store-fake-ip: false

hosts:
  'canary.monetafw.internal': 198.18.254.251

dns:
  enable: true
  prefer-h3: false
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.claude.ai'
    - '+.claude.com'
    - '+.clau.de'
    - '+.anthropic.com'
    - '+.claudeusercontent.com'
  fake-ip-filter-mode: whitelist
  nameserver:
    - 'udp://223.5.5.5'
    - 'udp://119.29.29.29'
  default-nameserver:
    - '223.5.5.5'

proxies:
  - name: anytls-node
    type: anytls
    server: 154.53.75.226
    port: 8450
    password: 7c62cf6b-1bb1-48f5-b308-761c09ac072e
    sni: anytls6.node10.local
    skip-cert-verify: true
  - name: dead
    type: socks5
    server: 127.0.0.1
    port: 9
  - name: direct
    type: direct

proxy-groups:
  - name: ClaudeExit
    type: select
    proxies:
      - anytls-node
      - dead
      - REJECT
      - DIRECT
  - name: EdgeProbe
    type: select
    proxies:
      - direct
      - dead

rules:
  - 'DOMAIN-SUFFIX,example.com,EdgeProbe'
  - 'DOMAIN-SUFFIX,example.org,EdgeProbe'
  - 'DOMAIN-SUFFIX,claude.ai,ClaudeExit'
  - 'DOMAIN-SUFFIX,claude.com,ClaudeExit'
  - 'DOMAIN-SUFFIX,clau.de,ClaudeExit'
  - 'DOMAIN-SUFFIX,anthropic.com,ClaudeExit'
  - 'DOMAIN-SUFFIX,claudeusercontent.com,ClaudeExit'
  - 'IP-CIDR,198.18.0.0/16,ClaudeExit,no-resolve'
  - 'MATCH,DIRECT'
