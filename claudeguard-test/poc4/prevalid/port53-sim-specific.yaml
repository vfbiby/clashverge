# PoC-4 预验配置 (mihomo v1.19.32, zhangsike 普通用户态运行, 无 root)
# 与 config-tun.yaml 的全部差别 (共两处, 其余逐字一致):
#   1) 无 tun 入站段 —— utun 设备创建需要 root, 预验只验 DNS/白名单/REST/规则面
#   2) dns.listen: 127.0.0.2:53 -> 127.0.0.2:1053 (非特权绑不了 <1024 端口)
# 通过 `diff config-tun.yaml config-prevalid.yaml` 可复核以上为唯一差异。
mixed-port: 17893
allow-lan: false
bind-address: '127.0.0.1'
mode: rule
log-level: info
external-controller: 127.0.0.1:19096
secret: ''

profile:
  store-selected: false
  store-fake-ip: false

dns:
  enable: true
  prefer-h3: false
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 最小化白名单模式 (P15): 仅 claude 系域名进 fake-ip, 其余全部真实解析 (零侵入)
  fake-ip-filter:
    - '+.claude.ai'
    - '+.claude.com'
    - '+.clau.de'
    - '+.anthropic.com'
    - '+.claudeusercontent.com'
  fake-ip-filter-mode: whitelist
  nameserver:
    - 'udp://223.5.5.5'
    - 'udp://119.29.29.29'
  default-nameserver:
    - '223.5.5.5'
    - '119.29.29.29'

proxies:
  # 健康节点 (PoC-2/3 延用; 规则面命中=PASS 口径, 边缘握手如实记录不作判定)
  - name: anytls-node
    type: anytls
    server: 154.53.75.226
    port: 8450
    password: 7c62cf6b-1bb1-48f5-b308-761c09ac072e
    sni: anytls6.node10.local
    skip-cert-verify: true
  # 死节点定义: 127.0.0.1:9 连接即刻被本地 RST (PoC-2 dead-a 同款)
  - name: dead
    type: socks5
    server: 127.0.0.1
    port: 9
  # 直连扮演"健康出口" (PoC-3 direct 扮演策略延续)
  - name: direct
    type: direct

proxy-groups:
  # 专属出口: 看门状态机的操作对象 (REST PUT /proxies/ClaudeExit)
  - name: ClaudeExit
    type: select
    proxies:
      - anytls-node
      - dead
      - REJECT
      - DIRECT
  # 探活边缘: example.org -> EdgeProbe, 看门探针专用 (select: direct / dead, 永不含 REJECT)
  - name: EdgeProbe
    type: select
    proxies:
      - direct
      - dead

rules:
  # 探活边缘 (看门真值探针 + 对照 alias)
  - 'DOMAIN-SUFFIX,example.com,EdgeProbe'
  - 'DOMAIN-SUFFIX,example.org,EdgeProbe'
  # 置顶: claude 系域名唯一出口
  - 'DOMAIN-SUFFIX,claude.ai,ClaudeExit'
  - 'DOMAIN-SUFFIX,claude.com,ClaudeExit'
  - 'DOMAIN-SUFFIX,clau.de,ClaudeExit'
  - 'DOMAIN-SUFFIX,anthropic.com,ClaudeExit'
  - 'DOMAIN-SUFFIX,claudeusercontent.com,ClaudeExit'
  # 兜底: 未进 fake-ip 池的 198.18.x.x (如 /etc/hosts 诱饵 198.18.254.254 经窄路由
  # 进 TUN 后无 reverse-map) 也一律走 ClaudeExit —— 诱饵路径同样被管辖
  - 'IP-CIDR,198.18.0.0/16,ClaudeExit,no-resolve'
  # 其余全部直连
  - 'MATCH,DIRECT'
